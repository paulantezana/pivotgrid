<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Enterprise Pivot Grid V10</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="bg-gray-100 h-screen p-4 overflow-hidden flex flex-col">

  <!-- Header Config -->
  <header
    class="mb-3 flex flex-wrap justify-between items-center gap-4 bg-white p-3 rounded shadow-sm border border-gray-200">
    <div>
      <h1 class="text-xl font-bold text-slate-800">Enterprise Pivot Grid V11</h1>
      <p class="text-xs text-slate-500">Auto-Hiding Panels • Column Chooser Modal • Reorder</p>
    </div>
    <div class="flex items-center gap-4">
      <button id="toggleSidePanelBtn"
        class="text-xs bg-gray-100 hover:bg-gray-200 border px-3 py-1 rounded text-gray-700">
        <i class="fas fa-columns mr-1"></i> Side Panel
      </button>
    </div>
  </header>

  <!-- GRID CONTAINER -->
  <div id="myGrid" class="flex-1 w-full shadow-lg rounded-lg overflow-hidden relative"></div>

  <!-- GLOBAL COLUMN MENU (Portal) -->
  <div id="columnMenu" class="popup-menu"></div>

  <!-- COLUMN CHOOSER MODAL (Portal) -->
  <div id="columnChooser" class="column-chooser-modal hidden">
    <div class="chooser-header">
      <span>Choose Columns</span>
      <button id="closeChooserBtn" class="text-gray-400 hover:text-red-500"><i class="fas fa-times"></i></button>
    </div>
    <div class="chooser-body" id="chooserList"></div>
  </div>

  <script src="./script.js"></script>
</body>

</html>
