<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Enterprise Pivot Grid V10</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="bg-gray-100 h-screen p-4 overflow-hidden flex flex-col">

  <!-- Header Config -->


  <!-- GRID CONTAINER -->
  <div id="myGrid" class="flex-1 w-full shadow-lg rounded-lg overflow-hidden relative"></div>

  <!-- GLOBAL COLUMN MENU (Portal) -->
  <div id="columnMenu" class="popup-menu"></div>

  <!-- COLUMN CHOOSER MODAL (Portal) -->
  <div id="columnChooser" class="column-chooser-modal hidden">
    <div class="chooser-header">
      <span>Choose Columns</span>
      <button id="closeChooserBtn" class="text-gray-400 hover:text-red-500"><i class="fas fa-times"></i></button>
    </div>
    <div class="chooser-body" id="chooserList"></div>
  </div>

  <script src="./script.js"></script>
</body>

</html>
